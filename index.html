        <div class="row" id="movieCard">

    </div>
    <div class="backDrop closeForm" id="backDrop"></div>

    <div class="movieModel">
        <form action="" class="movieForm" id="movieForm">
            <div class="card net-sec-btn">
                <div class="card-header d-flex align-items-center justify-content-between">
                    <h4 class="m-0">Add Movie</h4>

                    <i class="fa-solid fa-xmark fa-2x text-white closeForm"></i>
                </div>
                <div class="card-body">
                    <!-- <div class="col-md-6"> -->
                    <div class="d-flex justify-content-between">
                        <div class="col-6 px-0 pr-1">
                            <div class="form-group">
                                <label for="movieName">Movie Name<span class="text-danger">*</span></label>
                                <input type="text" required class="form-control" id="movieName">
                            </div>
                        </div>

                        <div class="col-6 px-0">
                            <div class="form-group">
                                <label for="movieYear">Movie Year<span class="text-danger">*</span></label>
                                <input type="date" required class="form-control" id="movieYear">
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="movieImage">Movie Image<span class="text-danger">*</span></label>
                        <input type="url" required class="form-control" id="movieImage">
                    </div>

                    <div class="form-group">
                        <label for="movieDescription">Movie Description<span class="text-danger">*</span></label>
                        <textarea type="text" required class="form-control" rows="3" id="movieDescription"></textarea>
                    </div>

                    <div class="d-flex justify-content-between ">
                        <div class="col-md-6 px-0 pr-1">
                            <div class="form-group">
                                <label for="movieRating">Movie Rating<span class="text-danger">*</span></label>
                                <select class="form-control" required id="movieRating">

                                    <option value="1">1</option>
                                    <option value="2">2</option>
                                    <option value="3">3</option>
                                    <option value="4">4</option>
                                    <option value="5">5</option>
                                    <option value="6">6</option>
                                    <option value="7">7</option>
                                    <option value="8">8</option>
                                    <option value="9">9</option>
                                    <option value="10">10</option>
                                </select>
                            </div>

                        </div>
                        <div class="col-md-6 px-0 pr-1">
                            <div class="form-group">
                                <label for="movieGenre">Movie Genre<span class="text-danger">*</span></label>
                                <select class="form-control" required id="movieGenre">

                                    <option value="Drama">Drama</option>
                                    <option value="Sci-fi">Sci-fi</option>
                                    <option value="Comedy">Comedy</option>
                                    <option value="Action">Action</option>
                                    <option value="Horror">Horror</option>
                                    <option value="Thriller">Thriller</option>
                                    <option value="Animation">Animation</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- </div> -->
                <div class="card-footer d-flex justify-content-between align-items-center">
                    <button type="submit" class="btn btn-sm btn-outline-info net-pri-btn" id="addMovie">Add
                        Movie</button>
                    <button type="button" class="btn btn-sm btn-outline-info net-sec-btn d-none" id="updateMovie">Update
                        Movie</button>
                    <button type="button" class="btn btn-sm btn-outline-info net-sec-btn closeForm">Close</button>
                </div>


            </div>
        </form>
    </div>

    <div class="spinner" id="spinner">
        <button class="btn btn-primary" type="button" disabled>
            <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
            Loading...
        </button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="./assets/js/app.js"></script>
</body>
